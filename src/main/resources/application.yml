spring:
  application:
    name: auth-service
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  h2:
    console:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: your-secret-key-change-this-in-production
    expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.example.auth: DEBUG
