server.port=8080
spring.application.name=auth-backend

# Database configuration
spring.datasource.url=jdbc:mysql://mysql-db:3306/user_auth?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT configuration
spring.security.jwt.secret=${JWT_SECRET:MySuperSecretKey2024ForJWT12345678901234567890}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}
